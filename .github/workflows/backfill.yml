name: Histórico de ajustes B3 (preencher)

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "Data inicial (AAAA-MM-DD)"
        required: true
        default: "2025-11-10"
      fim:
        description: "Data final (AAAA-MM-DD)"
        required: true
        default: "2026-11-09"

permissions:
  contents: write

concurrency:
  group: ajustes-b3
  cancel-in-progress: false

jobs:
  preencher:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Buscar ajustes passados
        run: python3 .github/scripts/backfill.py "${{ inputs.inicio }}" "${{ inputs.fim }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add di-dap-futuro/ajustes.json di-dap-futuro/backfill_log.txt
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "Histórico de ajustes B3 ${{ inputs.inicio }} a ${{ inputs.fim }}"
          git pull --rebase
          git push
