name: Ajustes B3 (DI1 e DAP)

# Horários em UTC (Brasília = UTC-3). Vários horários porque o GitHub às vezes descarta execuções agendadas e atrasa as
# outras (em nov/2026, de 4 a 10 h); rodar de novo só regrava os mesmos números.
#  Toda execução -> ajuste oficial dos últimos pregões pelo arquivo PR da B3 (só os que ainda não vieram completos)
#  Depois das 18:30 de Brasília -> também o fechamento do dia (último negócio, negociados, em aberto)
#    10:23, 12:41, 15:07, 19:53, 22:17 e 23:43 UTC = 07:23, 09:41, 12:07, 16:53, 19:17 e 20:43
on:
  schedule:
    - cron: "23 10 * * 1-5"
    - cron: "41 12 * * 1-5"
    - cron: "7 15 * * 1-5"
    - cron: "53 19 * * 1-5"
    - cron: "17 22 * * 1-5"
    - cron: "43 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ajustes-b3
  cancel-in-progress: false

jobs:
  salvar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Baixar e gravar ajustes
        run: python3 .github/scripts/ajustes.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add di-dap-futuro/ajustes.json
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "Ajustes B3 $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
