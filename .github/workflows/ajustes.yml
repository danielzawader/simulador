name: Ajustes B3 (DI1 e DAP)

# Horários em UTC (Brasília = UTC-3):
#  11:00 UTC = 08:00 -> grava o ajuste oficial do pregão anterior
#  22:00 UTC = 19:00 -> grava o fechamento do dia (último negócio, negociados, em aberto)
on:
  schedule:
    - cron: "0 11 * * 1-5"
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ajustes-b3
  cancel-in-progress: false

jobs:
  salvar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e gravar ajustes
        run: python3 .github/scripts/ajustes.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add di-dap-futuro/ajustes.json
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "Ajustes B3 $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          git push
